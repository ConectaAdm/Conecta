<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CONECTA</title>
  <link rel="stylesheet" href="../css/login.css">
  <!-- Responsividade (celular/tablet): deve ser o último CSS --> 
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module" src="../js/login.js" defer></script>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CONECTA">
    <script src="/js/pwa.js" defer></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <a href="/" class="logo">CONECTA</a>
      <h2>Acesse sua conta</h2>
      <p>Entre para acessar suas salas e materiais de estudo</p>
    </div>

    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label for="email">E-mail Universitário</label>
        <input type="email" id="email" name="email" placeholder="seu.nome@faculdade.edu.br" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
      </div>

      <div class="form-options">
        <label><input type="checkbox" id="lembrar"> Lembrar de mim</label>
        <a href="#">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <div class="auth-footer">
      <p>Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>
  </div>
</body>
</html>
