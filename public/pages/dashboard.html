<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECTA - Rede de Estudos & Materiais</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <!-- Navbar Superior -->
    <header class="navbar">
        <div class="logo-area">
            <img src="../assets/CONECTA-LOGO.png" alt="CONECTA Logo">
        </div>

        <!-- Área de Perfil -->
        <div class="user-profile-container">
            <div class="user-avatar-wrapper" onclick="toggleProfileMenu()">
                <div id="userAvatarInitials" class="user-avatar">PD</div>
                <div class="user-info-brief">
                    <span id="headerUserName" class="user-name">Pedro Daniel</span>
                    <span id="headerUserCourse" class="user-course">Eng. Software • 4º P.</span>
                </div>
            </div>

            <!-- Menu Dropdown -->
            <div id="profileMenu" class="profile-dropdown">
                <a onclick="openProfileModal()">⚙️ Meu Perfil</a>
                <a onclick="alert('Configurações em desenvolvimento.')">🔒 Configurações</a>
                <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 0.25rem 0;">
                <a class="logout-btn" onclick="fazerLogout()">🚪 Sair da Conta</a>
            </div>
        </div>
    </header>
    
    <!-- Main Container -->
    <main class="main-container">
