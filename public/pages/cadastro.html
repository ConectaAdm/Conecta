<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - C.O.N.E.C.T.A</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <!-- Responsividade (celular/tablet): deve ser o último CSS --> 
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/cadastro.js" defer></script>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CONECTA">
    <script src="/js/pwa.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <form class="auth-card">
            <h2>Crie sua conta</h2>
            <p>Conecte-se e estude com universitários de todo o Brasil</p>

            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="faculdade">Instituição de Ensino</label>
                <input type="text" id="faculdade" name="faculdade" placeholder="Ex: UFRJ, USP, Unicamp..." required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary">Criar Conta</button>

            <p class="auth-footer">
                Criar conta <a href="/login">Entrar</a>
            </p>
        </form>
    </main>
</body>
</html>
