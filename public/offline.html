<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Sem conexão - CONECTA</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    img { width: 96px; height: 96px; margin-bottom: 1.25rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.75rem; color: #0f172a; }
    p { color: #64748b; line-height: 1.5; margin-bottom: 1.75rem; }
    button {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="CONECTA">
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente. As páginas que você já visitou continuam disponíveis.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
  <script>
    // Recarrega sozinho quando a internet voltar
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
